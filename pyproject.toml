[project]
name = "performance-monitor"
description = "Оверлей мониторинга производительности в стиле Steam поверх RTSS и MSI Afterburner"
readme = "README.md"
# Нижняя граница продиктована PySide6 6.11 (нужен 3.10+), верхняя -- её же
# верхним потолком. Проверить актуальность: `pdm lock` подскажет диапазон сам.
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
dynamic = ["version"]

# Всё, что нужно кроме интерфейса, читается из общей памяти через ctypes,
# поэтому сторонних библиотек для сбора метрик не требуется вовсе.
dependencies = [
    "PySide6>=6.6",
]

classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
performance-monitor = "perfmon.app:run"

# Вариант без консольного окна -- для ярлыка на рабочем столе
[project.gui-scripts]
performance-monitor-gui = "perfmon.app:run"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "file"
path = "perfmon/__init__.py"

[tool.pdm.build]
includes = ["perfmon"]

[tool.pdm.scripts]
start = { cmd = "python main.py", help = "Запустить оверлей" }
demo = { cmd = "python main.py --fps demo", help = "Запустить с псевдо-FPS, без RTSS" }
bench = { cmd = "python -m perfmon.bench", help = "Замерить стоимость сбора метрик и отрисовки" }
lint = { cmd = "ruff check perfmon main.py", help = "Проверить стиль" }
fmt = { cmd = "ruff format perfmon main.py", help = "Отформатировать" }
check = { composite = ["lint", "bench"], help = "Полная проверка" }

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PERF", "RUF"]
ignore = [
    "N802",    # paintEvent / resizeEvent -- сигнатуры Qt
    "RUF001",  # кириллица в строках и комментариях
    "RUF002",
    "RUF003",
]
